<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guerra Logística - Manutenção</title><link rel="stylesheet" href="/styles.css"></head><body>
<aside><img src="/logo-guerra.png" alt="Guerra Logística"><p>CONTROLE DE MANUTENÇÃO</p><div class="user">Mecânico responsável<br><b>Fabiano Silva</b></div></aside>
<main><header><div><small>OFICINA / CONTROLE PESSOAL</small><h1>Histórico de veículos</h1></div><button id="newVehicle">+ Cadastrar veículo</button></header>
<section class="layout"><div class="panel"><div class="panel-head"><h2>Veículos cadastrados</h2><input id="search" placeholder="Buscar placa ou modelo..."></div><div id="vehicles" class="vehicles"></div></div><div id="details" class="panel empty"><div><span class="icon">▣</span><h2>Selecione um veículo</h2><p>O histórico completo aparecerá aqui.</p></div></div></section></main>
<dialog id="vehicleDialog"><form method="dialog" id="vehicleForm"><div class="dialog-head"><h2>Novo veículo</h2><button type="button" class="close" onclick="vehicleDialog.close()">×</button></div><label>Foto do veículo<input id="photo" type="file" accept="image/*" capture="environment"></label><img id="preview" class="preview" hidden><div class="grid"><label>Placa<input name="plate" required placeholder="ABC1D23"></label><label>Chassi / VIN<input name="vin"></label><label>Marca<input name="make" required></label><label>Modelo<input name="model" required></label><label>Ano<input name="year" type="number"></label><label>Cor<input name="color"></label></div><label>Observações<input name="notes"></label><button class="primary">Salvar veículo</button></form></dialog>
<dialog id="serviceDialog"><form method="dialog" id="serviceForm"><div class="dialog-head"><h2>Registrar manutenção</h2><button type="button" class="close" onclick="serviceDialog.close()">×</button></div><label>O que foi feito?<textarea name="description" required placeholder="Ex.: Troca de óleo do motor"></textarea></label><div class="grid"><label>Quilometragem<input name="mileage" type="number" required></label><label>Data<input name="date" type="date" required></label><label>Peças utilizadas<input name="parts"></label><label>Mecânico<input name="technician" value="Fabiano Silva"></label></div><label>Observações<textarea name="notes"></textarea></label><button class="primary">Adicionar ao histórico</button></form></dialog><script src="/app.js"></script></body></html>
